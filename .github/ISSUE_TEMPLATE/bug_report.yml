name: Bug report
description: Something is not working as expected
labels: [bug]

body:
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Describe the issue you encountered. Include what you saw, what error messages appeared, or what went wrong.
      placeholder: |
        When I clicked the verify button, the page showed an error.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
      description: What should have happened instead?
      placeholder: |
        The verification should have completed successfully.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the steps that led to the issue
      placeholder: |
        1. Navigate to the dashboard
        2. Create a new workflow
        3. Click the verify button
        4. Observe the error
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include relevant details such as your browser, operating system, or any other context
      placeholder: |
        - Browser: Chrome 120.0
        - OS: macOS 14
        - Account: standard plan
    validations:
      required: false

  - type: checkboxes
    id: confirmation
    attributes:
      label: Confirmation
      description: Please confirm you have not included credentials, real customer data, or production account information
      options:
        - label: I have not included credentials, API keys, real customer data, or any information from a production account
          required: true
