name: Feature request
description: Suggest an improvement or new capability
labels: [enhancement]

body:
  - type: textarea
    id: problem
    attributes:
      label: What problem are you trying to solve?
      description: Describe the problem or limitation you have encountered. Focus on the underlying need, not your proposed solution.
      placeholder: |
        When verifying workflows, I cannot see which fields caused a mismatch between the automation's claim and the actual CRM record.
    validations:
      required: true

  - type: textarea
    id: who
    attributes:
      label: Who would benefit from this?
      description: Who would use this feature? Is it just you, or a broader group?
      placeholder: |
        Anyone debugging failed verifications would benefit from more detailed field-level evidence.
    validations:
      required: true

  - type: textarea
    id: current_workaround
    attributes:
      label: How do you work around this today?
      description: What do you currently do instead?
      placeholder: |
        I export the CRM record manually and compare it to the verification report by hand.
    validations:
      required: true
