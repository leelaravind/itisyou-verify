# ITISYOU Verify — public continuous integration.
#
# THREAT MODEL FOR THIS FILE (this repository is public and accepts fork pull requests):
#
#  1. No deployment secret is ever available here. This workflow runs typecheck, lint,
#     the unit/integration suites, the security suite and the secret scan, all against
#     synthetic data. Deployment lives in a SEPARATE, manually-triggered workflow that
#     runs only on refs inside this repository. If you find yourself adding
#     `secrets.CLOUDFLARE_API_TOKEN` to this file, stop: you are about to hand every
#     fork-PR author a production credential.
#
#  2. `pull_request_target` is DELIBERATELY NOT USED. That trigger runs the workflow
#     definition from the BASE branch but with repository secrets available, while the
#     PR head is attacker-controlled code. Checking out and building the head under
#     `pull_request_target` is the single most reliable way to leak a public repo's
#     secrets. GitHub documents that with the plain `pull_request` trigger,
#     "with the exception of GITHUB_TOKEN, secrets are not passed to the runner when a
#     workflow is triggered from a forked repository", and that write permissions are
#     downgraded to read-only for fork PRs. That is exactly the property we want, so we
#     use `pull_request` and accept that fork PRs cannot do anything privileged.
#     https://docs.github.com/en/actions/security-for-github-actions/security-guides/using-secrets-in-github-actions
#
#  3. Every action is pinned to a full 40-character commit SHA, not a tag. A tag is
#     mutable: whoever controls the action repository can repoint v4 at new code that
#     reads the runner's environment. The version is kept in a trailing comment so a
#     human can still tell what is pinned. SHAs resolved from the GitHub API on
#     2026-09-19; re-resolve, do not hand-edit, when bumping.
#
#  4. `permissions: contents: read` at the top level. No job widens it. Nothing here
#     writes a comment, a check, a package or a deployment.
#
#  5. The pnpm store is cached. Nothing that could contain a credential is cached:
#     no `.wrangler/`, no `.dev.vars`, no `node_modules` from a privileged job.

name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege for GITHUB_TOKEN across every job in this workflow.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Belt and braces: even if a step tried to read a deployment secret, there is nothing
  # to read, and the suites are configured to block outbound fetch (tests/setup.ts).
  CI: 'true'
  NODE_OPTIONS: --max-old-space-size=4096

jobs:
  verify:
    name: typecheck, lint, tests, secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          # `--history` needs the full history, not a shallow clone. This is the only
          # reason we fetch depth 0; it costs nothing on a repository this size.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          # Matches `packageManager` in package.json. Keep the two in step.
          version: 11.22.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      # One suite: unit, integration and the security regression tests all run from the
      # root vitest config. A security suite CI does not run is not a control.
      - name: Unit, integration and security tests
        run: pnpm test

      - name: Secret scan (tracked tree)
        run: node scripts/scan-secrets.mjs

      - name: Secret scan (full git history)
        if: github.event_name == 'pull_request'
        run: node scripts/scan-secrets.mjs --history

      # Build output is scanned too: a secret that is safe in source can still be
      # inlined into a bundle by a build step. Nothing is uploaded anywhere.
      - name: Build worker bundle (dry run) and scan it
        run: |
          pnpm --filter @verify/app build
          node scripts/scan-secrets.mjs --paths apps/app/dist

  # ---------------------------------------------------------------------------
  # The release gate number.
  #
  # This job exists because a total taken on a developer machine is not a measurement
  # of a commit. While the suite was being measured on a live working tree here it moved
  # from 1,793 to 2,196 distinct cases in twenty minutes, and one category read 0 passing
  # purely because thirteen files landed after that run had started. Nothing was wrong
  # with the script; the thing it was measuring was changing underneath it.
  #
  # A checkout in CI is clean by construction and pinned to one SHA, so the number this
  # job produces belongs to that commit and can be re-derived from it. The artefact it
  # uploads — `release-gate-<sha>` — is the ONLY number anyone may cite for the
  # "at least 500 distinct passing cases" requirement. `scripts/release.mjs` refuses a
  # production deploy unless the artefact it is shown was produced here, at HEAD.
  #
  # It runs the suite a second time rather than reusing the `verify` job's run: the JSON
  # reporter output is the evidence, and a gate that depends on another job having
  # happened to leave a file behind is not a gate.
  # ---------------------------------------------------------------------------
  gate:
    name: release gate number (clean checkout, one SHA)
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false

      - name: Set up pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 11.22.0
          run_install: false

      - name: Set up Node 22
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: '22'
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Writes reports/test-results.json from the runner's own JSON output. A failing
      # suite is a legitimate outcome to record: the artefact reports it rather than
      # this step hiding it.
      - name: Full vitest suite with the JSON reporter
        run: node scripts/build-test-report.mjs

      # The ledger checker runs inside this script and its exit code is recorded in the
      # artefact. Playwright is not run here: the browser suite needs `wrangler dev` and
      # a seeded automation identity, so every playwright-only case is recorded as
      # unmeasured and counts zero rather than being assumed to pass.
      - name: Build the release gate artefact
        run: node scripts/build-gate-artefact.mjs

      - name: Summarise the gate on the run page
        if: always()
        run: |
          {
            echo '## Release gate — `'"${GITHUB_SHA:0:12}"'`'
            echo ''
            echo '```json'
            cat reports/release-gate.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # Keyed to the commit SHA on purpose. An artefact whose name does not name its
      # commit is one copy-paste away from being quoted about a different one.
      - name: Upload release-gate-${{ github.sha }}
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release-gate-${{ github.sha }}
          path: |
            reports/release-gate.json
            reports/test-results.json
            reports/test-report.md
          if-no-files-found: error
          retention-days: 90
